<h5 style="    margin-left: 10px;">Hip-Hop Steps</h5>
<div class="step-lib-container">
    <div class="step-grid">
      <div 
      (dblclick)="openEditStepDialog(step)"
       class="step-tile"
       (click) ="selectStep(step)"
        *ngFor="let step of steps">
        <span >{{ step.name }}</span>
      </div>
    </div>
  </div>
