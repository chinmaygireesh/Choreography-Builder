

<div class="layout-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Download Button with Tooltip -->
    <button mat-mini-fab color="primary" 
            matTooltip="Download choreography to file" 
            (click)="saveChoreographyToFile()">
      <mat-icon>download</mat-icon>
    </button>
    
    <!-- File Upload with Tooltip -->
    <label class="file-upload-label" 
           matTooltip="Upload choreography JSON file">
      <mat-icon>upload</mat-icon>
      <input type="file" 
             (change)="loadChoreographyFromFile($event)" 
             accept=".json" 
             class="file-input">
    </label>
  </div>
  
    <!-- Wide Side Menu (40%) -->
    <div class="side-menu">
      <app-step-lib></app-step-lib>
    </div>
    <!-- Display Area (50%) -->
    <div class="display-area">
      <app-display-area></app-display-area>
    </div>
  

  <!-- Timeline (Bottom) -->
  <div class="timelineContainer">
    <app-timeline [bpm]="120"></app-timeline>
    <!-- <button (click)="loadChoreography()">Load Choreography</button> -->
  </div>
</div>
